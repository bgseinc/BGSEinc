    <meta name="theme-color" content="#0d1714" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <style>
      /* Critical: paint the brand background immediately so the page is never white while the app loads. */
      html { background: #0d1714; }
      #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d1714; }
      #splash img { width: 140px; height: auto; animation: splash-pulse 1.4s ease-in-out infinite; }
      @keyframes splash-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="splash"><img src="/images/logo/logo-light.webp" alt="BG Sports Enterprises" width="419" height="279" /></div></div>
